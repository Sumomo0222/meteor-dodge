<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#05060d">
<meta name="color-scheme" content="dark">
<title>太空躲陨石 · SPACE METEOR DODGE</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<style>
:root{--amber:#ffd60a;--orange:#ff9f1c}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  background:#02030a;
  background-image:radial-gradient(circle at 50% 18%,#0c1230 0%,#060814 45%,#02030a 100%);
  display:flex;align-items:center;justify-content:center;
  font-family:"Courier New",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
  user-select:none;-webkit-user-select:none;
}
#stage{position:relative;touch-action:none;
  box-shadow:0 0 0 4px #1e293b,0 0 0 8px #0b1120,0 24px 70px rgba(0,0,0,.75)}
#game{display:block;width:100%;height:100%;background:#05060d;
  image-rendering:pixelated;image-rendering:crisp-edges}
.fx-scan{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
.fx-vig{position:absolute;inset:0;z-index:4;pointer-events:none;
  box-shadow:inset 0 0 70px rgba(0,0,0,.6)}
#muteBtn{position:absolute;z-index:6;top:58px;right:6px;width:30px;height:30px;
  background:rgba(10,14,30,.75);border:2px solid #33415a;color:#9fb3d1;
  font-size:13px;line-height:1;cursor:pointer;padding:0}
#muteBtn:active{transform:translateY(1px)}
#overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  background:rgba(3,5,14,.62);animation:fadein .25s ease-out}
#overlay.hidden{display:none}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.panel{text-align:center;padding:24px 22px;background:rgba(8,12,26,.94);
  border:4px solid #38bdf8;box-shadow:0 0 0 4px #04060f,10px 10px 0 rgba(0,0,0,.5);
  max-width:88%;animation:fadein .3s ease-out}
.title{font-size:28px;font-weight:900;color:var(--amber);letter-spacing:4px;white-space:nowrap;
  text-shadow:3px 3px 0 #d97706,5px 5px 0 rgba(0,0,0,.65);margin-bottom:8px}
.subtitle{font-size:10px;color:#38bdf8;letter-spacing:4px;margin-bottom:14px}
.hiscore{font-size:12px;color:#8aa0c0;letter-spacing:2px;margin:12px 0 16px}
.hiscore b{color:#fff;font-size:14px}
.btn{font-family:inherit;font-weight:900;font-size:17px;letter-spacing:6px;text-indent:6px;
  padding:13px 30px;color:#221200;background:var(--orange);border:none;cursor:pointer;
  box-shadow:0 6px 0 #b45309,7px 7px 0 rgba(0,0,0,.45);
  transition:transform .04s,box-shadow .04s;animation:glow 1.8s ease-in-out infinite}
.btn:hover{background:#ffb35c}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #b45309,2px 2px 0 rgba(0,0,0,.45)}
@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}
.help{margin-top:18px;font-size:11px;color:#7e94b8;line-height:2.1;letter-spacing:1px}
.help b{color:#d7e5ff}
.dead{font-size:22px;font-weight:900;color:#ef4444;letter-spacing:8px;text-indent:8px;
  text-shadow:3px 3px 0 #7f1d1d;margin-bottom:10px}
.score-label{font-size:10px;color:#38bdf8;letter-spacing:4px;margin-top:4px}
.score-big{font-size:32px;font-weight:900;color:#fff;letter-spacing:4px;
  text-shadow:3px 3px 0 rgba(0,0,0,.8);margin:2px 0 4px}
.newbest{font-size:13px;font-weight:900;color:var(--amber);letter-spacing:3px;margin:6px 0;
  animation:blink .75s steps(2,start) infinite}
.hidden{display:none!important}
@keyframes blink{50%{opacity:.1}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="320" height="480"></canvas>
  <div class="fx-scan"></div>
  <div class="fx-vig"></div>
  <button id="muteBtn" title="声音开关">🔊</button>
  <div id="overlay">
    <div class="panel" id="menuPanel">
      <div class="title">太空躲陨石</div>
      <div class="subtitle">SPACE · METEOR · DODGE</div>
      <div class="hiscore">最高分 <b id="menuHi">000000</b></div>
      <button class="btn" id="startBtn">开始游戏</button>
      <div class="help">
        <b>← → ↑ ↓</b> / <b>WASD</b> 控制飞船<br>
        手机：<b>手指拖动</b> 屏幕移动<br>
        躲开陨石！坚持越久，得分越高
      </div>
    </div>
    <div class="panel hidden" id="overPanel">
      <div class="dead">飞船坠毁</div>
      <div class="score-label">SCORE</div>
      <div class="score-big" id="finalScore">000000</div>
      <div class="newbest hidden" id="newBest">★ NEW RECORD ★</div>
      <div class="hiscore">最高分 <b id="overHi">000000</b></div>
      <button class="btn" id="retryBtn">重新挑战</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';
/* ================= 基础 ================= */
const W=320,H=480;
const cv=document.getElementById('game');
const ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const stage=document.getElementById('stage');

function fit(){
  const pad=10;
  const aw=Math.max(200,innerWidth-pad*2),ah=Math.max(240,innerHeight-pad*2);
  let s=Math.min(aw/W,ah/H,3);
  s=Math.max(0.8,Math.floor(s*4)/4);
  stage.style.width=(W*s)+'px';
  stage.style.height=(H*s)+'px';
}
addEventListener('resize',fit);
addEventListener('orientationchange',fit);
fit();

/* ================= 3x5 像素字体 ================= */
const GLYPHS={
'0':['111','101','101','101','111'],'1':['010','110','010','010','111'],
'2':['111','001','111','100','111'],'3':['111','001','011','001','111'],
'4':['101','101','111','001','001'],'5':['111','100','111','001','111'],
'6':['111','100','111','101','111'],'7':['111','001','001','010','010'],
'8':['111','101','111','101','111'],'9':['111','101','111','001','111'],
'+':['000','010','111','010','000'],'-':['000','000','111','000','000'],
'!':['010','010','010','000','010'],'.':['000','000','000','000','010'],
' ':['000','000','000','000','000'],
'C':['111','100','100','100','111'],'E':['111','100','111','100','111'],
'H':['101','101','111','101','101'],'I':['111','010','010','010','111'],
'L':['100','100','100','100','111'],'O':['111','101','101','101','111'],
'P':['111','101','111','100','100'],'R':['111','101','111','110','101'],
'S':['111','100','111','001','111'],'U':['101','101','101','101','111'],
'V':['101','101','101','101','010']
};
function drawText(str,x,y,color,scale,align){
  scale=scale||1;
  str=String(str).toUpperCase();
  const wTot=str.length*4*scale-scale;
  if(align==='center')x-=Math.round(wTot/2);
  else if(align==='right')x-=wTot;
  ctx.fillStyle=color;
  let cx=x;
  for(const ch of str){
    const g=GLYPHS[ch];
    if(g){for(let r=0;r<5;r++){const row=g[r];
      for(let c=0;c<3;c++)if(row[c]==='1')ctx.fillRect(cx+c*scale,y+r*scale,scale,scale);}}
    cx+=4*scale;
  }
  return wTot;
}
function pad(n){return String(n).padStart(6,'0');}

/* ================= 精灵 ================= */
const PAL={w:'#f8fafc',W:'#cbd5e1',c:'#67e8f9',C:'#0e7490',y:'#fbbf24',o:'#78350f'};
function makeSprite(rows){
  const w=rows[0].length,h=rows.length;
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const ch=rows[y][x];
    if(PAL[ch]){g.fillStyle=PAL[ch];g.fillRect(x,y,1,1);}
  }
  return c;
}
const shipSpr=makeSprite([
'......w......',
'......W......',
'.....cWc.....',
'.....CWC.....',
'....cCWCC....',
'....CWWWCC...',
'...CCWWWCCC..',
'..yCCWWWCCCy.',
'.yyCC.W.CCyy.',
'.yC..WWW..Cy.',
'..W...W...W..',
'.....o.o.....'
]);

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};}

function genMeteorSprite(size,seed){
  const rnd=mulberry32(seed);
  const gray=rnd()<0.35;
  const col=gray
    ?{base:'#7e8590',dark:'#575d68',light:'#a7aeb9',crater:'#414651',rim:'#262a31'}
    :{base:'#a9714b',dark:'#7c4a33',light:'#c99a6f',crater:'#5b3221',rim:'#33190f'};
  const R=size/2;
  const solid=[];
  for(let y=0;y<size;y++){solid[y]=[];
    for(let x=0;x<size;x++){
      const dx=x+0.5-R,dy=y+0.5-R,ang=Math.atan2(dy,dx);
      const wob=0.86+0.16*Math.sin(ang*3+rnd()*6.283)+0.10*Math.sin(ang*5+rnd()*6.283);
      solid[y][x]=Math.hypot(dx,dy)<=R*wob;
    }}
  const c=document.createElement('canvas');c.width=size;c.height=size;
  const g=c.getContext('2d');
  const allSolid=(x,y)=>y>=0&&y<size&&x>=0&&x<size&&solid[y][x];
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    if(!solid[y][x])continue;
    const edge=!allSolid(x-1,y)||!allSolid(x+1,y)||!allSolid(x,y-1)||!allSolid(x,y+1);
    let color;
    if(edge)color=col.rim;
    else{
      const dx=x+0.5-R,dy=y+0.5-R;
      const nd=(dx+dy)/(2*R);
      color=nd<-0.25?col.light:(nd>0.45?col.dark:col.base);
      if(rnd()<0.06)color=col.dark;
    }
    g.fillStyle=color;g.fillRect(x,y,1,1);
  }
  const n=1+Math.floor(rnd()*3)+Math.floor(size/12);
  for(let i=0;i<n;i++){
    const cx2=2+Math.floor(rnd()*(size-4)),cy2=2+Math.floor(rnd()*(size-4));
    const cr=1+Math.floor(rnd()*Math.max(1,size/9));
    for(let dy=-cr;dy<=cr;dy++)for(let dx=-cr;dx<=cr;dx++){
      if(dx*dx+dy*dy<=cr*cr){
        const X=cx2+dx,Y=cy2+dy;
        if(allSolid(X,Y)&&allSolid(X-1,Y)&&allSolid(X+1,Y)&&allSolid(X,Y-1)&&allSolid(X,Y+1)){
          g.fillStyle=col.crater;g.fillRect(X,Y,1,1);
        }
      }
    }
  }
  return c;
}
const METS={S:[],M:[],L:[]};
(function(){
  const sizes={S:[10,13],M:[15,19],L:[22,27]};
  let sd=7;
  for(const k in sizes)for(const sz of sizes[k])for(let i=0;i<3;i++)METS[k].push(genMeteorSprite(sz,sd++));
})();

/* 星空背景 */
const bg=document.createElement('canvas');bg.width=W;bg.height=H;
(function(){
  const g=bg.getContext('2d');
  g.fillStyle='#060a17';g.fillRect(0,0,W,H);
  const blobs=[[80,120,140,'rgba(40,60,140,0.22)'],[250,300,170,'rgba(90,40,120,0.18)'],[160,430,150,'rgba(20,80,110,0.18)']];
  for(const[bx,by,br,bc]of blobs){
    const rg=g.createRadialGradient(bx,by,0,bx,by,br);
    rg.addColorStop(0,bc);rg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=rg;g.fillRect(bx-br,by-br,br*2,br*2);
  }
})();
const stars=[];
for(let i=0;i<64;i++){
  const l=i%3;
  stars.push({x:Math.random()*W,y:Math.random()*H,sp:[16,38,85][l],
    c:['#233258','#3f568f','#7d97d0'][l],big:l===2,tw:Math.random()*6.28});
}

/* ================= 状态 ================= */
let state='menu';
let score=0,dodged=0,level=1;
let hi=parseInt(localStorage.getItem('space_meteor_hi')||'0',10)||0;
const ship={x:W/2,y:H-70,vx:0,vy:0};
let alive=false;
let meteors=[],parts=[],floats=[];
let spawnT=1.2,ambT=0.6,trailT=0,overT=0,flash=0,shake=0,panelShown=false,newBest=false;
const keys={};

/* ================= DOM ================= */
const overlay=document.getElementById('overlay');
const menuPanel=document.getElementById('menuPanel');
const overPanel=document.getElementById('overPanel');
const startBtn=document.getElementById('startBtn');
const retryBtn=document.getElementById('retryBtn');
const menuHi=document.getElementById('menuHi');
const overHi=document.getElementById('overHi');
const finalScore=document.getElementById('finalScore');
const newBestEl=document.getElementById('newBest');
const muteBtn=document.getElementById('muteBtn');

function refreshHi(){menuHi.textContent=pad(hi);overHi.textContent=pad(hi);}
refreshHi();

/* ================= 音效（WebAudio 芯片音） ================= */
let AC=null,master=null;
let muted=localStorage.getItem('space_meteor_mute')==='1';
function updMuteIcon(){muteBtn.textContent=muted?'🔇':'🔊';}
updMuteIcon();
function initAudio(){
  if(!AC){
    try{
      AC=new(window.AudioContext||window.webkitAudioContext)();
      master=AC.createGain();
      master.gain.value=muted?0:0.6;
      master.connect(AC.destination);
    }catch(e){}
  }else if(AC.state==='suspended'){AC.resume();}
}
muteBtn.addEventListener('click',function(e){
  e.stopPropagation();
  muted=!muted;
  localStorage.setItem('space_meteor_mute',muted?'1':'0');
  if(master)master.gain.value=muted?0:0.6;
  updMuteIcon();muteBtn.blur();
});
function beep(f0,f1,dur,type,vol,delay){
  if(!AC||muted)return;
  try{
    const t=AC.currentTime+(delay||0);
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'square';
    o.frequency.setValueAtTime(f0,t);
    if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
    g.gain.setValueAtTime(vol||0.3,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(master);
    o.start(t);o.stop(t+dur+0.03);
  }catch(e){}
}
function boom(){
  if(!AC||muted)return;
  try{
    const t=AC.currentTime,dur=0.7;
    const buf=AC.createBuffer(1,(AC.sampleRate*dur)|0,AC.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.6);
    const src=AC.createBufferSource();src.buffer=buf;
    const f=AC.createBiquadFilter();f.type='lowpass';
    f.frequency.setValueAtTime(1400,t);f.frequency.exponentialRampToValueAtTime(90,t+dur);
    const g=AC.createGain();
    g.gain.setValueAtTime(0.9,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(f);f.connect(g);g.connect(master);
    src.start(t);
    beep(150,35,0.6,'sawtooth',0.4);
  }catch(e){}
}

/* ================= 输入 ================= */
addEventListener('keydown',function(e){
  const k=e.key;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].indexOf(k)>=0)e.preventDefault();
  if(k==='ArrowLeft'||k==='a'||k==='A')keys.left=true;
  if(k==='ArrowRight'||k==='d'||k==='D')keys.right=true;
  if(k==='ArrowUp'||k==='w'||k==='W')keys.up=true;
  if(k==='ArrowDown'||k==='s'||k==='S')keys.down=true;
  if((k==='Enter'||k===' ')&&(state==='menu'||(state==='gameover'&&panelShown)))startGame();
});
addEventListener('keyup',function(e){
  const k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A')keys.left=false;
  if(k==='ArrowRight'||k==='d'||k==='D')keys.right=false;
  if(k==='ArrowUp'||k==='w'||k==='W')keys.up=false;
  if(k==='ArrowDown'||k==='s'||k==='S')keys.down=false;
});
let pid=null,tX=0,tY=0,touch=false;
function ptTarget(e){
  const r=cv.getBoundingClientRect();
  tX=(e.clientX-r.left)*W/r.width;
  tY=(e.clientY-r.top)*H/r.height-34;
  tX=Math.max(8,Math.min(W-8,tX));
  tY=Math.max(70,Math.min(H-14,tY));
}
cv.addEventListener('pointerdown',function(e){
  initAudio();
  if(pid!==null)return;
  pid=e.pointerId;touch=true;ptTarget(e);
  try{cv.setPointerCapture(pid);}catch(err){}
});
cv.addEventListener('pointermove',function(e){if(e.pointerId===pid)ptTarget(e);});
function rel(e){if(e.pointerId===pid){pid=null;touch=false;}}
cv.addEventListener('pointerup',rel);
cv.addEventListener('pointercancel',rel);
cv.addEventListener('contextmenu',function(e){e.preventDefault();});
document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',function(e){e.preventDefault();});
document.addEventListener('visibilitychange',function(){lastT=performance.now();});

/* ================= 粒子 / 飘字 ================= */
function addPart(x,y,vx,vy,life,size,color){
  parts.push({x:x,y:y,vx:vx,vy:vy,life:life,max:life,size:size,color:color});
  if(parts.length>380)parts.splice(0,parts.length-380);
}
function explode(x,y,n){
  const cols=['#ffffff','#ffd60a','#ff9f1c','#ef4444','#f97316','#94a3b8','#67e8f9'];
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,sp=30+Math.random()*170;
    addPart(x,y,Math.cos(a)*sp,Math.sin(a)*sp,
      0.35+Math.random()*0.8,1+Math.floor(Math.random()*3),
      cols[Math.floor(Math.random()*cols.length)]);
  }
  for(let i=0;i<14;i++){
    const a=Math.random()*Math.PI*2,sp=15+Math.random()*60;
    addPart(x,y,Math.cos(a)*sp,Math.sin(a)*sp,0.9+Math.random()*0.7,1,'#64748b');
  }
}

/* ================= 陨石生成 ================= */
function pushMeteor(cls,vy,vx){
  const spr=METS[cls][Math.floor(Math.random()*METS[cls].length)];
  meteors.push({spr:spr,cls:cls,w:spr.width,h:spr.height,
    x:spr.width/2+3+Math.random()*(W-spr.width-6),
    y:-spr.height-2,vy:vy,vx:vx});
}
function spawnPlaying(){
  const r=Math.random();
  const bigC=Math.min(0.30,0.10+0.02*level);
  const cls=r<bigC?'L':(r<bigC+0.30?'M':'S');
  const adj=cls==='L'?0.72:(cls==='M'?0.92:1.12);
  const base=Math.min(240,78+(level-1)*18);
  const drift=Math.min(70,10+6*(level-1));
  pushMeteor(cls,base*adj*(0.75+Math.random()*0.5),(Math.random()-0.5)*2*drift);
}
function spawnAmbient(){
  const r=Math.random();
  const cls=r<0.25?'L':(r<0.6?'M':'S');
  pushMeteor(cls,40+Math.random()*75,(Math.random()-0.5)*30);
}
/* 菜单氛围：先撒几颗 */
for(let i=0;i<4;i++){spawnAmbient();meteors[meteors.length-1].y=Math.random()*H*0.8;}

/* ================= 流程 ================= */
function startGame(){
  initAudio();
  beep(523,null,0.07,'square',0.3);
  beep(784,null,0.09,'square',0.3,0.08);
  score=0;dodged=0;level=1;
  meteors=[];parts=[];floats=[];
  spawnT=1.2;ambT=0;overT=0;flash=0;shake=0;panelShown=false;newBest=false;
  ship.x=W/2;ship.y=H-70;ship.vx=0;ship.vy=0;
  alive=true;state='playing';
  overlay.classList.add('hidden');
}
function die(){
  alive=false;state='gameover';overT=1.1;panelShown=false;
  explode(ship.x,ship.y,64);
  shake=8;flash=0.5;
  boom();
  beep(320,60,0.7,'sawtooth',0.35,0.05);
  const fs=Math.floor(score);
  if(fs>hi){hi=fs;localStorage.setItem('space_meteor_hi',String(hi));newBest=true;}
  refreshHi();
  finalScore.textContent=pad(fs);
  newBestEl.classList.toggle('hidden',!newBest);
}
function showOverPanel(){
  panelShown=true;
  menuPanel.classList.add('hidden');
  overPanel.classList.remove('hidden');
  overlay.classList.remove('hidden');
}
startBtn.addEventListener('click',function(){startGame();startBtn.blur();});
retryBtn.addEventListener('click',function(){startGame();retryBtn.blur();});

/* ================= 更新 ================= */
function update(dt){
  const sm=state==='menu'?0.45:(state==='gameover'?0.75:1);
  for(const s of stars){s.y+=s.sp*sm*dt;if(s.y>H){s.y=-2;s.x=Math.random()*W;}}

  if(state==='playing'){
    spawnT-=dt;
    if(spawnT<=0){
      spawnPlaying();
      if(level>=5&&Math.random()<0.18)spawnPlaying();
      spawnT=Math.max(0.26,0.92-0.055*(level-1))*(0.6+Math.random()*0.8);
    }
  }else{
    ambT-=dt;
    if(ambT<=0){spawnAmbient();ambT=(state==='menu'?1.9:1.4)*(0.6+Math.random());}
  }

  for(let i=meteors.length-1;i>=0;i--){
    const m=meteors[i];
    m.y+=m.vy*dt;m.x+=m.vx*dt;
    if(m.x<m.w/2){m.x=m.w/2;m.vx=Math.abs(m.vx);}
    else if(m.x>W-m.w/2){m.x=W-m.w/2;m.vx=-Math.abs(m.vx);}
    if(m.y-m.h/2>H){
      meteors.splice(i,1);
      if(state==='playing'){
        dodged++;
        const bonus=m.cls==='L'?25:(m.cls==='M'?15:10);
        score+=bonus;
        floats.push({x:m.x,y:H-10,txt:'+'+bonus,life:0.7,color:'#9ae6b4',scale:1});
        beep(1318,null,0.045,'square',0.05);
        const nl=Math.min(15,1+Math.floor(dodged/12));
        if(nl>level){
          level=nl;flash=Math.max(flash,0.12);
          floats.push({x:W/2,y:170,txt:'LEVEL UP!',life:1.2,color:'#ffd60a',scale:2});
          beep(523,null,0.09,'square',0.3);
          beep(659,null,0.09,'square',0.3,0.09);
          beep(784,null,0.09,'square',0.3,0.18);
          beep(1046,null,0.14,'square',0.3,0.27);
        }
      }
      continue;
    }
    if(state==='playing'&&alive){
      const dx=m.x-ship.x,dy=m.y-ship.y;
      const rr=m.w*0.4+4.5;
      if(dx*dx+dy*dy<rr*rr){meteors.splice(i,1);die();}
    }
  }

  if(state==='playing'&&alive){
    const acc=1600,damp=8,mv=235;
    const ax=(keys.right?1:0)-(keys.left?1:0);
    const ay=(keys.down?1:0)-(keys.up?1:0);
    if(touch){
      const dx=tX-ship.x,dy=tY-ship.y,d=Math.hypot(dx,dy);
      if(d>1){const sp=Math.min(265,d*12);ship.x+=dx/d*sp*dt;ship.y+=dy/d*sp*dt;}
    }else{
      ship.vx+=ax*acc*dt;ship.vy+=ay*acc*dt;
      const dmp=1-Math.min(1,damp*dt);
      ship.vx*=dmp;ship.vy*=dmp;
      const v=Math.hypot(ship.vx,ship.vy);
      if(v>mv){ship.vx*=mv/v;ship.vy*=mv/v;}
      ship.x+=ship.vx*dt;ship.y+=ship.vy*dt;
    }
    ship.x=Math.max(8,Math.min(W-8,ship.x));
    ship.y=Math.max(70,Math.min(H-14,ship.y));
    trailT-=dt;
    if(trailT<=0){
      trailT=0.035;
      const side=Math.random()<0.5?-1:1;
      addPart(ship.x+side,ship.y+8,(Math.random()-0.5)*14,50+Math.random()*40,
        0.22+Math.random()*0.15,Math.random()<0.4?2:1,
        Math.random()<0.5?'#ff9f1c':'#ffd60a');
    }
    score+=dt*(8+level*2);
  }

  if(state==='gameover'&&!panelShown){overT-=dt;if(overT<=0)showOverPanel();}

  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.life-=dt;
    if(p.life<=0){parts.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=70*dt;
  }
  for(let i=floats.length-1;i>=0;i--){
    const f=floats[i];
    f.life-=dt;f.y-=20*dt;
    if(f.life<=0)floats.splice(i,1);
  }
  if(flash>0)flash-=dt*2.2;
  if(shake>0)shake=Math.max(0,shake-14*dt);
}

/* ================= 渲染 ================= */
function render(){
  const now=performance.now()/1000;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.drawImage(bg,0,0);
  if(shake>0)ctx.translate(((Math.random()*2-1)*shake)|0,((Math.random()*2-1)*shake)|0);

  for(const s of stars){
    if(s.big){
      if(Math.sin(now*2.5+s.tw)>-0.4){ctx.fillStyle=s.c;ctx.fillRect(s.x|0,s.y|0,2,2);}
    }else{ctx.fillStyle=s.c;ctx.fillRect(s.x|0,s.y|0,1,1);}
  }
  for(const m of meteors)ctx.drawImage(m.spr,(m.x-m.w/2)|0,(m.y-m.h/2)|0);

  for(const p of parts){
    ctx.globalAlpha=Math.min(1,Math.ceil(p.life/p.max*4)/4);
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x|0,p.y|0,p.size,p.size);
  }
  ctx.globalAlpha=1;

  if(alive){
    const left=Math.round(ship.x)-6,top=Math.round(ship.y)-6;
    const fl=2+(((now*24)|0)+(Math.random()*2|0))%3;
    ctx.fillStyle='#ff9f1c';
    ctx.fillRect(left+5,top+12,1,fl);
    ctx.fillRect(left+7,top+12,1,fl);
    ctx.fillStyle='#ffd60a';
    ctx.fillRect(left+6,top+12,1,Math.max(1,fl-1));
    ctx.drawImage(shipSpr,left,top);
  }

  for(const f of floats){
    if(f.life<0.25&&((f.life*20)|0)%2===0)continue;
    drawText(f.txt,f.x,f.y,f.color,f.scale||1,'center');
  }

  ctx.setTransform(1,0,0,1,0,0);
  if(state!=='menu'){
    drawText('SCORE',8,7,'#5f7aa6',1);
    drawText(pad(Math.floor(score)),8,15,'#f1f5f9',2);
    drawText('HI',W-8,7,'#5f7aa6',1,'right');
    drawText(pad(hi),W-8,15,'#94a3b8',2,'right');
    drawText('LV '+level,W/2,7,'#fbbf24',1,'center');
  }
  if(flash>0){
    ctx.fillStyle='rgba(255,255,255,'+Math.min(0.85,flash)+')';
    ctx.fillRect(0,0,W,H);
  }
}

/* ================= 主循环 ================= */
let lastT=0;
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(t-lastT)/1000)||0;
  lastT=t;
  update(dt);
  render();
}
requestAnimationFrame(frame);
})();
</script>
</body>
